# =============================================
# Expensum — Development Profile
# Activate with: SPRING_PROFILES_ACTIVE=dev
#
# All values must be set via environment variables.
# Copy .env.example → .env, fill in values, then run: source .env
# =============================================

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA — Flyway manages schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Actuator — expose all endpoints in dev
management.endpoints.web.exposure.include=*

# Logging — verbose in dev
logging.level.com.expensum=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
