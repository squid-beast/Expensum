# =============================================
# Budget Buddy — Development Profile
# Activate with: SPRING_PROFILES_ACTIVE=dev
# =============================================

# Database (local PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5433/budgetbuddy
spring.datasource.username=postgres
spring.datasource.password=

# JPA — auto-update schema, verbose SQL logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT — development-only secret (NOT for production)
jwt.secret=BudgetBuddySecretKeyThatIsAtLeast256BitsLongForHS256Algorithm!!

# CORS — allow Vite dev server
app.cors.allowed-origins=http://localhost:5173

# Actuator — expose all endpoints in dev
management.endpoints.web.exposure.include=*

# Logging — verbose in dev
logging.level.com.budgetbuddy=DEBUG
logging.level.org.springframework.security=DEBUG
