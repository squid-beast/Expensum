# =============================================
# Budget Buddy — Production Profile
# Activate with: SPRING_PROFILES_ACTIVE=prod
# All sensitive values MUST come from environment variables.
# =============================================

# Database (from environment)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA — validate schema only (use Flyway/Liquibase for migrations)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT (from environment — must be at least 256 bits / 32+ characters)
jwt.secret=${JWT_SECRET}

# CORS (from environment — comma-separated origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Actuator — restricted in production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging — production level
logging.level.com.budgetbuddy=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
