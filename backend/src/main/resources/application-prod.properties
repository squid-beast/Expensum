# =============================================
# Expensum — Production Profile
# Activate with: SPRING_PROFILES_ACTIVE=prod
#
# ALL values are read from environment variables.
# NO secrets or credentials are hardcoded here.
# Set these in your cloud platform (Koyeb, Render, etc.)
# =============================================

# Database — injected by cloud platform
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA — Flyway manages schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT — must be at least 256 bits (32+ characters)
jwt.secret=${JWT_SECRET}

# CORS — comma-separated list of allowed frontend origins
# e.g. https://expensum.app,https://www.expensum.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Actuator — restricted in production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging — production levels only
logging.level.com.expensum=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
