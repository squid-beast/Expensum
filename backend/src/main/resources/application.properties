spring.application.name=Expensum

# Active profile — override with env var SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server — reads PORT env var injected by cloud platforms (Koyeb, Render, Railway, etc.)
# Falls back to 8080 for local dev
server.port=${PORT:8080}

# Database driver — common to all profiles
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA dialect — common to all profiles
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT expiration — 24h in ms (not a secret, safe here)
jwt.expiration=86400000

# Actuator — default restricted; profiles can override
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging pattern with correlation ID
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId:-}] %-5level %logger{36} - %msg%n
