spring.application.name=Budget Buddy

# Database driver (shared across all profiles)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA shared settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT expiration (24 hours, shared default)
jwt.expiration=86400000

# Server
server.port=8080

# Actuator (restrict by default, profiles can override)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging pattern with correlation ID
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId:-}] %-5level %logger{36} - %msg%n
